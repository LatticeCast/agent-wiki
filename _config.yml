title: agent-wiki
url: ""
baseurl: ""
blob_base: /blob

# _site/blob is a mount of the git-ignored ./blob folder: never clean it.
keep_files:
  - blob

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"

kramdown:
  parse_block_html: true

exclude:
  - docker-compose.yml
  - Dockerfile
  - .dockerignore

plugins:
  - jekyll-external-links
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jekyll-seo-tag
