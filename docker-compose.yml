name: agent-wiki

# Generated output never touches the host: _stage1/ and _site/ are Docker
# volumes shared by the py and jekyll containers. Only the repo's source
# folders are mounted (read-only); ./blob (git-ignored) is mounted at /blob.
services:
  py:
    profiles: ["tools"]
    build:
      context: ./build
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: sh -c "uv run --no-sync python lint/lint.py --root wiki && find _stage1 -mindepth 1 -delete && uv run --no-sync python build/bulid.py compile --root wiki --out _stage1"
    volumes:
      - ./build:/app/build:ro
      - ./lint:/app/lint:ro
      - ./tests:/app/tests:ro
      - ./wiki:/app/wiki:ro
      - ./assets:/app/assets:ro
      - ./_layouts:/app/_layouts:ro
      - ./_config.yml:/app/_config.yml:ro
      - ./Gemfile:/app/Gemfile:ro
      - ./Gemfile.lock:/app/Gemfile.lock:ro
      - stage1:/app/_stage1
      - site:/app/_site

  jekyll:
    image: jekyll/jekyll:latest
    working_dir: /srv/jekyll/_stage1
    ports:
      - "4000:4000"
    command:
      - sh
      - -c
      - |
        [ -f Gemfile ] || { echo "_stage1 is empty, run make stage1 first"; exit 1; }
        bundle install && bundle exec jekyll serve --source . --destination ../_site --host 0.0.0.0 --port 4000 --no-watch
    volumes:
      - stage1:/srv/jekyll/_stage1
      - site:/srv/jekyll/_site
      - ./blob:/srv/jekyll/_site/blob
      - bundle_cache:/usr/local/bundle

volumes:
  stage1:
  site:
  bundle_cache:
