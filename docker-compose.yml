name: agent-wiki

# Generated output never touches the host: _stage1/ and _site/ are Docker
# volumes shared by the py and jekyll containers. Only the repo's source
# folders are mounted (read-only); ./blob (git-ignored) is mounted at /blob.
services:
  py:
    build:
      context: .
      dockerfile: wikic/Dockerfile
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: uv run --no-sync python wikic/wikic.py compile
    volumes:
      - ./wikic:/app/wikic:ro
      - ./tests:/app/tests:ro
      - ./pages:/app/pages:ro
      - ./assets:/app/assets:ro
      - ./viewer:/app/viewer:ro
      - ./_layouts:/app/_layouts:ro
      - ./_config.yml:/app/_config.yml:ro
      - ./Gemfile:/app/Gemfile:ro
      - ./Gemfile.lock:/app/Gemfile.lock:ro
      - stage1:/app/_stage1
      - site:/app/_site

  jekyll:
    image: jekyll/jekyll:latest
    working_dir: /srv/jekyll/_stage1
    ports:
      - "4000:4000"
    command: sh -c "bundle install && bundle exec jekyll build --source . --destination ../_site"
    volumes:
      - stage1:/srv/jekyll/_stage1
      - site:/srv/jekyll/_site
      - ./blob:/srv/jekyll/_site/blob
      - bundle_cache:/usr/local/bundle

volumes:
  stage1:
  site:
  bundle_cache:
